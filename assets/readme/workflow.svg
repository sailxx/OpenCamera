<svg xmlns="http://www.w3.org/2000/svg" width="880" height="345"
 viewBox="0 0 880 345" role="img" aria-label="From device to live picture">
 <title>From device to live picture</title>
 <style>text {font-family: "Golos Text","Segoe UI",system-ui,sans-serif}</style>
 <defs>
   <linearGradient id="ground" x2="0" y2="1" gradientUnits="objectBoundingBox">
     <stop stop-color="#141920"/><stop offset="1" stop-color="#080c13"/>
   </linearGradient>
   <radialGradient id="light"><stop stop-color="#276dde" stop-opacity=".29"/>
     <stop offset="1" stop-color="#276dde" stop-opacity="0"/></radialGradient>
   <linearGradient id="action"><stop stop-color="#1768ce"/><stop offset="1" stop-color="#123c76"/></linearGradient>
   <clipPath id="outer"><rect width="880" height="345" rx="21"/></clipPath>
 </defs>
 <g clip-path="url(#outer)">
   <rect x="0" y="0" width="880" height="345" rx="21" fill="url(#ground)" stroke="none"/>
   <ellipse cx="739.1999999999999" cy="124.19999999999999" rx="519.1999999999999" ry="313.95" fill="url(#light)"/>
   <text x="32" y="40" font-size="12" fill="#83bcff" font-weight="700">WORKFLOW</text><text x="32" y="81" font-size="31" fill="#f2f6fc" font-weight="750">From device to live picture</text><rect x="32" y="107" width="402" height="96" rx="13" fill="#141d2a" stroke="#27354a"/><rect x="47" y="122" width="7" height="7" rx="3" fill="#539bff" stroke="none"/><text x="63" y="132" font-size="16" fill="#f2f6fc" font-weight="700">Choose a device</text><text x="48" y="160" font-size="14" fill="#aeb9ca" font-weight="400">Select your camera or use the</text><text x="48" y="181" font-size="14" fill="#aeb9ca" font-weight="400">GStreamer test pattern.</text><rect x="446" y="107" width="402" height="96" rx="13" fill="#141d2a" stroke="#27354a"/><rect x="461" y="122" width="7" height="7" rx="3" fill="#539bff" stroke="none"/><text x="477" y="132" font-size="16" fill="#f2f6fc" font-weight="700">Choose a mode</text><text x="462" y="160" font-size="14" fill="#aeb9ca" font-weight="400">Start with Automatic or choose</text><text x="462" y="181" font-size="14" fill="#aeb9ca" font-weight="400">a specific advertised capture mode.</text><rect x="32" y="217" width="402" height="96" rx="13" fill="#141d2a" stroke="#27354a"/><rect x="47" y="232" width="7" height="7" rx="3" fill="#539bff" stroke="none"/><text x="63" y="242" font-size="16" fill="#f2f6fc" font-weight="700">Start preview</text><text x="48" y="270" font-size="14" fill="#aeb9ca" font-weight="400">Check the video and read the</text><text x="48" y="291" font-size="14" fill="#aeb9ca" font-weight="400">capture rate shown under the picture.</text><rect x="446" y="217" width="402" height="96" rx="13" fill="#141d2a" stroke="#27354a"/><rect x="461" y="232" width="7" height="7" rx="3" fill="#539bff" stroke="none"/><text x="477" y="242" font-size="16" fill="#f2f6fc" font-weight="700">Tune and apply</text><text x="462" y="270" font-size="14" fill="#aeb9ca" font-weight="400">Adjust a control the camera supports.</text><text x="462" y="291" font-size="14" fill="#aeb9ca" font-weight="400">Apply changes to write them to the device.</text>
 </g>
 <rect x="0.5" y="0.5" width="879" height="344" rx="21" fill="none" stroke="#273346"/>
</svg>
