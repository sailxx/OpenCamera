<svg xmlns="http://www.w3.org/2000/svg" width="880" height="235"
 viewBox="0 0 880 235" role="img" aria-label="Supported modes and local tools">
 <title>Supported modes and local tools</title>
 <style>text {font-family: "Golos Text","Segoe UI",system-ui,sans-serif}</style>
 <defs>
   <linearGradient id="ground" x2="0" y2="1" gradientUnits="objectBoundingBox">
     <stop stop-color="#141920"/><stop offset="1" stop-color="#080c13"/>
   </linearGradient>
   <radialGradient id="light"><stop stop-color="#276dde" stop-opacity=".29"/>
     <stop offset="1" stop-color="#276dde" stop-opacity="0"/></radialGradient>
   <linearGradient id="action"><stop stop-color="#1768ce"/><stop offset="1" stop-color="#123c76"/></linearGradient>
   <clipPath id="outer"><rect width="880" height="235" rx="21"/></clipPath>
 </defs>
 <g clip-path="url(#outer)">
   <rect x="0" y="0" width="880" height="235" rx="21" fill="url(#ground)" stroke="none"/>
   <ellipse cx="739.1999999999999" cy="84.6" rx="519.1999999999999" ry="213.85" fill="url(#light)"/>
   <text x="32" y="40" font-size="12" fill="#83bcff" font-weight="700">BY THE NUMBERS</text><text x="32" y="81" font-size="31" fill="#f2f6fc" font-weight="750">Supported modes and local tools</text><rect x="32" y="107" width="402" height="96" rx="13" fill="#141d2a" stroke="#27354a"/><rect x="47" y="122" width="7" height="7" rx="3" fill="#539bff" stroke="none"/><text x="63" y="132" font-size="16" fill="#f2f6fc" font-weight="700">30 / 60 / 120 FPS</text><text x="48" y="160" font-size="14" fill="#aeb9ca" font-weight="400">Rates provided by the synthetic test source.</text><text x="48" y="181" font-size="14" fill="#aeb9ca" font-weight="400">Physical modes depend on the camera.</text><rect x="446" y="107" width="402" height="96" rx="13" fill="#141d2a" stroke="#27354a"/><rect x="461" y="122" width="7" height="7" rx="3" fill="#539bff" stroke="none"/><text x="477" y="132" font-size="16" fill="#f2f6fc" font-weight="700">3 appearance modes</text><text x="462" y="160" font-size="14" fill="#aeb9ca" font-weight="400">System, light and dark in the native app.</text><text x="462" y="181" font-size="14" fill="#aeb9ca" font-weight="400">The HTML design explores more themes.</text>
 </g>
 <rect x="0.5" y="0.5" width="879" height="234" rx="21" fill="none" stroke="#273346"/>
