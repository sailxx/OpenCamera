<svg xmlns="http://www.w3.org/2000/svg" width="880" height="455"
 viewBox="0 0 880 455" role="img" aria-label="Inside the workbench">
 <title>Inside the workbench</title>
 <style>text {font-family: "Golos Text","Segoe UI",system-ui,sans-serif}</style>
 <defs>
   <linearGradient id="ground" x2="0" y2="1" gradientUnits="objectBoundingBox">
     <stop stop-color="#141920"/><stop offset="1" stop-color="#080c13"/>
   </linearGradient>
   <radialGradient id="light"><stop stop-color="#276dde" stop-opacity=".29"/>
     <stop offset="1" stop-color="#276dde" stop-opacity="0"/></radialGradient>
   <linearGradient id="action"><stop stop-color="#1768ce"/><stop offset="1" stop-color="#123c76"/></linearGradient>
   <clipPath id="outer"><rect width="880" height="455" rx="21"/></clipPath>
 </defs>
 <g clip-path="url(#outer)">
   <rect x="0" y="0" width="880" height="455" rx="21" fill="url(#ground)" stroke="none"/>
   <ellipse cx="739.1999999999999" cy="163.79999999999998" rx="519.1999999999999" ry="414.05" fill="url(#light)"/>
   <text x="32" y="40" font-size="12" fill="#83bcff" font-weight="700">FEATURES</text><text x="32" y="81" font-size="31" fill="#f2f6fc" font-weight="750">Inside the workbench</text><rect x="32" y="107" width="402" height="96" rx="13" fill="#141d2a" stroke="#27354a"/><rect x="47" y="122" width="7" height="7" rx="3" fill="#539bff" stroke="none"/><text x="63" y="132" font-size="16" fill="#f2f6fc" font-weight="700">Camera discovery</text><text x="48" y="160" font-size="14" fill="#aeb9ca" font-weight="400">Select a V4L2 device and rescan</text><text x="48" y="181" font-size="14" fill="#aeb9ca" font-weight="400">after connecting a USB webcam.</text><rect x="446" y="107" width="402" height="96" rx="13" fill="#141d2a" stroke="#27354a"/><rect x="461" y="122" width="7" height="7" rx="3" fill="#539bff" stroke="none"/><text x="477" y="132" font-size="16" fill="#f2f6fc" font-weight="700">Live preview</text><text x="462" y="160" font-size="14" fill="#aeb9ca" font-weight="400">Start and stop a local GStreamer stream.</text><text x="462" y="181" font-size="14" fill="#aeb9ca" font-weight="400">See the rate measured at capture.</text><rect x="32" y="217" width="402" height="96" rx="13" fill="#141d2a" stroke="#27354a"/><rect x="47" y="232" width="7" height="7" rx="3" fill="#539bff" stroke="none"/><text x="63" y="242" font-size="16" fill="#f2f6fc" font-weight="700">Capture modes</text><text x="48" y="270" font-size="14" fill="#aeb9ca" font-weight="400">Use automatic negotiation or select</text><text x="48" y="291" font-size="14" fill="#aeb9ca" font-weight="400">an advertised format, size and rate.</text><rect x="446" y="217" width="402" height="96" rx="13" fill="#141d2a" stroke="#27354a"/><rect x="461" y="232" width="7" height="7" rx="3" fill="#539bff" stroke="none"/><text x="477" y="242" font-size="16" fill="#f2f6fc" font-weight="700">Hardware controls</text><text x="462" y="270" font-size="14" fill="#aeb9ca" font-weight="400">Adjust driver-reported values, switches</text><text x="462" y="291" font-size="14" fill="#aeb9ca" font-weight="400">and menus, then read the values back.</text><rect x="32" y="327" width="402" height="96" rx="13" fill="#141d2a" stroke="#27354a"/><rect x="47" y="342" width="7" height="7" rx="3" fill="#539bff" stroke="none"/><text x="63" y="352" font-size="16" fill="#f2f6fc" font-weight="700">Diagnostics</text><text x="48" y="380" font-size="14" fill="#aeb9ca" font-weight="400">Find missing dependencies and</text><text x="48" y="401" font-size="14" fill="#aeb9ca" font-weight="400">inspect camera access or stream errors.</text><rect x="446" y="327" width="402" height="96" rx="13" fill="#141d2a" stroke="#27354a"/><rect x="461" y="342" width="7" height="7" rx="3" fill="#539bff" stroke="none"/><text x="477" y="352" font-size="16" fill="#f2f6fc" font-weight="700">Appearance</text><text x="462" y="380" font-size="14" fill="#aeb9ca" font-weight="400">Follow the desktop style or select</text><text x="462" y="401" font-size="14" fill="#aeb9ca" font-weight="400">light or dark appearance.</text>
 </g>
 <rect x="0.5" y="0.5" width="879" height="454" rx="21" fill="none" stroke="#273346"/>
</svg>
