name: Linux packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: linux-release-${{ inputs.version }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and test ${{ matrix.format }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        format: [deb, rpm, appimage]
    env:
      VERSION: ${{ inputs.version }}
      FORMAT: ${{ matrix.format }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate version and run unit tests
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 -m unittest discover -s tests -v
      - name: Build and smoke-test Debian package
        if: matrix.format == 'deb'
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e VERSION ubuntu:24.04 bash -euxc '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xvfb imagemagick xdotool
            bash packaging/build-deb.sh "$VERSION"
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "$PWD/dist/open-camera_${VERSION}_all.deb"
            dpkg-query -W open-camera
            cd /tmp
            mkdir -p /src/previews
            OPEN_CAMERA_PREVIEWS=/src/previews bash /src/packaging/smoke-x11.sh open-camera
          '
      - uses: actions/upload-artifact@v4
        if: matrix.format == 'deb'
        with:
          name: workbench-screenshots
          path: previews/*.png
          if-no-files-found: error
      - name: Build and smoke-test Fedora RPM
        if: matrix.format == 'rpm'
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e VERSION fedora:44 bash -euxc '
            dnf install -y rpm-build redhat-rpm-config tar gzip xorg-x11-server-Xvfb
            bash packaging/build-rpm.sh "$VERSION"
            dnf install -y "$PWD"/dist/*.rpm
            rpm -q open-camera
            cd /tmp
            bash /src/packaging/smoke-x11.sh open-camera
          '
      - name: Build AppImage
        if: matrix.format == 'appimage'
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e VERSION ubuntu:24.04 bash -euxc '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              python3 python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gstreamer-1.0 \
              gir1.2-gst-plugins-base-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
              v4l-utils libglib2.0-bin adwaita-icon-theme libgdk-pixbuf2.0-bin \
              ca-certificates curl desktop-file-utils file fonts-dejavu-core squashfs-tools
            bash packaging/build-appimage.sh "$VERSION"
          '
      - name: Smoke-test AppImage in a fresh Ubuntu container
        if: matrix.format == 'appimage'
        run: |
          docker run --rm -v "$PWD/dist:/packages:ro" \
            -v "$PWD/packaging/smoke-x11.sh:/smoke-x11.sh:ro" -e VERSION ubuntu:24.04 bash -euxc '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xvfb
            cd /tmp
            APPIMAGE_EXTRACT_AND_RUN=1 bash /smoke-x11.sh "/packages/OpenCamera-${VERSION}-x86_64.AppImage"
          '
      - uses: actions/upload-artifact@v4
        with:
          name: open-camera-${{ matrix.format }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: open-camera-*
          merge-multiple: true
      - name: Generate checksums and publish
        working-directory: dist
        run: |
          sha256sum -- *.deb *.rpm *.AppImage > SHA256SUMS
          cat > "$RUNNER_TEMP/open-camera-release.md" <<'EOF'
          The native GTK 4 workbench now follows the approved camera design. This update
          brings the centered preview controls, aligned cards, blue sliders, and
          the measured FPS meter to the installed Linux application.

          Capture controls show the formats and frame rates reported for each available
          resolution. Camera adjustments can be staged, reset to driver defaults, and applied.

          - **DEB** for Ubuntu 24.04 and compatible distributions.
          - **RPM** for Fedora. The workflow installs the package on Fedora 44.
          - **AppImage** for x86_64 Linux with glibc 2.39 or newer. Uses FUSE or extract-and-run.
          - **SHA256SUMS** lists the hashes of all three installers.

          All three artifacts were smoke-tested with a synthetic camera. Physical webcam
          compatibility still needs validation.
          EOF
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Open Camera $VERSION" \
            --notes-file "$RUNNER_TEMP/open-camera-release.md" *.deb *.rpm *.AppImage SHA256SUMS
